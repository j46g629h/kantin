<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EFEFED">
  <!--
    圖示（關卡 5-5）。三個位置各講不同的事，沒有一個浪費：
      分頁圖示（16/32px）→ PCI       只有 3 個字的空間，放最短最獨特的識別
      主畫面圖示（180px）→ PCI GA    空間夠，可以放完整
      主畫面名稱          → Kantin PCI（在 manifest.json）作業系統畫的，永遠清楚，
                                      負責回答「這是什麼」

    ⚠️ apple-touch-icon 一定要有 PNG——**iOS 不吃 SVG**。
       少了這個檔案，iPhone 加到主畫面時會拿「網頁截圖」當圖示。
    ⚠️ 那個 PNG 是**直角滿版**的：iOS 與 Android 會自己套圓角遮罩，
       圖檔自己再帶圓角的話會變成「圓角疊圓角」，四個角出現缺口。
  -->
  <link rel="icon" href="favicon.svg?v=3.2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3.2">
  <link rel="manifest" href="manifest.json?v=3.2">
  <style>html{background:#EFEFED}</style>
  <title>Cek Laporan · Kantin PCI</title>
  <link rel="stylesheet" href="css/style.css?v=3.2">
</head>
<body>

  <div class="page">

    <!-- 頁首 -->
    <header class="topbar">
      <a href="index.html" class="topbar-back" aria-label="back">‹</a>
      <h1 class="topbar-title" id="pageTitle">Cek Laporan</h1>
      <div class="lang-switch lang-switch-compact">
        <button type="button" class="lang-btn" data-lang="id">ID</button>
        <button type="button" class="lang-btn" data-lang="zh">中</button>
      </div>
    </header>

    <!-- 搜尋 -->
    <main>
      <form id="searchForm" class="field" novalidate>
        <label class="field-label" for="keyword">
          <span id="labelKeyword">Nomor Laporan atau NIK</span>
        </label>
        <input type="text" id="keyword" autocomplete="off" autocorrect="off" spellcheck="false" required>
        <div id="searchHint" class="field-note">Ketik nomor laporan atau NIK kamu</div>
        <button type="submit" id="searchBtn" class="btn-primary">Cari</button>
      </form>

      <!-- 載入中 -->
      <div id="loadingView" class="state-box hidden">
        <div class="spinner"></div>
        <p id="loadingText">Sebentar ya…</p>
      </div>

      <div id="searchError" class="result error hidden"></div>

      <!-- 查詢結果 -->
      <div id="resultInfo" class="result-info hidden"></div>
      <div id="resultList"></div>
    </main>

    <!-- 系統資訊 -->
    <footer class="site-footer" id="siteFooter"></footer>

  </div>

  <script src="js/config.js?v=3.2"></script>
  <script src="js/i18n.js?v=3.2"></script>
  <script src="js/ui.js?v=3.2"></script>
  <script src="js/api.js?v=3.2"></script>
  <script src="js/query.js?v=3.2"></script>

</body>
</html>
