<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Laporan · Kantin PCI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">
    <header class="topbar">
      <a href="index.html" class="topbar-back" aria-label="back">‹</a>
      <h1 class="topbar-title" id="pageTitle">Cek Laporan</h1>
    </header>

    <div class="state-box">
      <div style="font-size:48px">🚧</div>
      <p id="msg" style="margin-top:12px">Fitur ini sedang dikembangkan</p>
      <a href="index.html" class="btn-secondary" id="homeBtn">Kembali ke Beranda</a>
    </div>
    <footer class="site-footer" id="siteFooter"></footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // 關卡 2-5 會把這個頁面換成正式的查詢功能
    const TEXT = {
      zh: { title: '查詢案件', msg: '這個功能還在做，敬請期待', home: '返回首頁' },
      id: { title: 'Cek Laporan', msg: 'Fitur ini masih dibuat, tunggu ya', home: 'Kembali ke Beranda' },
    };
    const text = TEXT[getLang()] || TEXT.id;
    document.documentElement.lang = htmlLang();
    document.getElementById('pageTitle').textContent = text.title;
    document.getElementById('msg').textContent = text.msg;
    document.getElementById('homeBtn').textContent = text.home;
    document.title = text.title + ' · ' + t('appName');
    renderSystemFooter('siteFooter');
  </script>

</body>
</html>
