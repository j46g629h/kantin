<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交回報 · PCI 餐廳回饋系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">

    <!-- 頁首 -->
    <header class="topbar">
      <a href="index.html" class="topbar-back" aria-label="back">‹</a>
      <h1 class="topbar-title" id="pageTitle">提交回報</h1>
      <div class="lang-switch lang-switch-compact">
        <button type="button" class="lang-btn" data-lang="id">ID</button>
        <button type="button" class="lang-btn" data-lang="zh">中</button>
      </div>
    </header>

    <!-- 載入中 -->
    <div id="loadingView" class="state-box">
      <div class="spinner"></div>
      <p id="loadingText">載入中…</p>
    </div>

    <!-- 表單 -->
    <main id="formView" class="hidden">
      <form id="reportForm" novalidate>

        <!-- 工號 -->
        <section class="field">
          <label class="field-label" for="empId">
            <span id="labelEmpId">工號</span>
            <span class="tag tag-required" id="tagEmpId">必填</span>
          </label>
          <input type="text" id="empId" inputmode="numeric" autocomplete="off" required>
          <div id="empStatus" class="field-note"></div>
        </section>

        <!-- 餐廳地點 -->
        <section class="field">
          <label class="field-label" for="location">
            <span id="labelLocation">餐廳地點</span>
            <span class="tag tag-required">必填</span>
          </label>
          <select id="location" required></select>
        </section>

        <!-- 問題分類 -->
        <section class="field">
          <span class="field-label">
            <span id="labelCategory">問題分類</span>
            <span class="tag tag-required">必填</span>
          </span>
          <div id="categoryGrid" class="category-grid"></div>
        </section>

        <!-- 滿意度 -->
        <section class="field">
          <span class="field-label">
            <span id="labelRating">用餐滿意度</span>
            <span class="tag tag-required">必填</span>
          </span>
          <div id="stars" class="stars"></div>
          <div id="ratingHint" class="field-note">請點選星星評分</div>
        </section>

        <!-- 問題描述 -->
        <section class="field">
          <label class="field-label" for="description">
            <span id="labelDescription">問題描述</span>
            <span class="tag" id="tagDescription">選填</span>
          </label>
          <textarea id="description" rows="4" maxlength="1000"></textarea>
        </section>

        <div id="formError" class="result error hidden"></div>

        <button type="submit" id="submitBtn" class="btn-primary">提交回報</button>
      </form>
    </main>

    <!-- 提交成功 -->
    <div id="successView" class="hidden">
      <div class="state-box success-box">
        <div class="success-icon">✅</div>
        <h2 id="successTitle">提交成功</h2>
        <p class="muted" id="successThanks">感謝您的回報，我們會盡快處理</p>

        <div class="case-box">
          <div class="case-label" id="caseLabel">您的案件編號</div>
          <div class="case-id" id="caseId">—</div>
        </div>

        <p class="hint" id="caseRemember">請記下這組編號，日後可用它查詢處理進度</p>

        <button type="button" id="againBtn" class="btn-primary">再回報一則</button>
        <a href="index.html" class="btn-secondary" id="homeBtn">返回首頁</a>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/report.js"></script>

</body>
</html>
