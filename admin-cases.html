<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Daftar Laporan · Kantin PCI</title>
  <link rel="stylesheet" href="css/style.css?v=2.2">
</head>
<body>

  <div class="page page-wide">

    <!-- 頁首 -->
    <header class="topbar">
      <h1 class="topbar-title" id="pageTitle">Daftar Laporan</h1>
      <!-- 重新整理：重新載入並回到剛登入的乾淨狀態 -->
      <button type="button" id="refreshBtn" class="topbar-refresh" aria-label="refresh">
        <span class="refresh-icon">↻</span>
      </button>
      <div class="lang-switch lang-switch-compact">
        <button type="button" class="lang-btn" data-lang="id">ID</button>
        <button type="button" class="lang-btn" data-lang="zh">中</button>
      </div>
    </header>

    <!-- 登入者資訊列 -->
    <div id="adminBar" class="admin-bar hidden">
      <span class="admin-bar-who">
        <span id="adminName"></span>
        <span id="adminRole" class="tag"></span>
      </span>
      <span class="admin-bar-actions">
        <!-- 帳號管理：只有超級管理者看得到（真正的把關在後端的 withAuth） -->
        <a href="admin-accounts.html" id="accountsLink" class="admin-bar-link hidden">Kelola Akun</a>
        <button type="button" id="logoutBtn" class="admin-bar-logout">Keluar</button>
      </span>
    </div>

    <main>
      <!-- 驗證登入狀態中 -->
      <div id="bootView" class="state-box">
        <div class="spinner"></div>
        <p id="bootText">Mengecek status login…</p>
      </div>

      <div id="errorView" class="result error hidden"></div>

      <div id="mainView" class="hidden">

        <!--
          檢視範圍。下面三張卡片全部跟著這裡走，
          畫面上永遠只有一個尺度，不會出現「全部時間」與「某個月」並排。
        -->
        <button type="button" id="periodBar" class="period-bar">
          <span class="period-label" id="periodLabel">Semua Waktu</span>
          <span class="period-count" id="periodCount"></span>
          <span class="period-caret">▾</span>
        </button>

        <!-- 範圍選單：只列出真的有資料的月份 -->
        <div id="monthPicker" class="month-picker hidden"></div>

        <!-- 統計卡片：範圍 = 上方選定的期間；點一下依該狀態篩選 -->
        <div class="stat-row">
          <button type="button" class="stat-card stat-new" data-status="ST_NEW">
            <span class="stat-num" id="statNew">–</span>
            <span class="stat-label" id="statNewLabel">Belum Diproses</span>
          </button>
          <button type="button" class="stat-card stat-proc" data-status="ST_PROC">
            <span class="stat-num" id="statProc">–</span>
            <span class="stat-label" id="statProcLabel">Sedang Diproses</span>
          </button>
          <button type="button" class="stat-card stat-done" data-status="ST_DONE">
            <span class="stat-num" id="statDone">–</span>
            <span class="stat-label" id="statDoneLabel">Selesai</span>
          </button>
        </div>

        <!--
          逾期提示。刻意固定顯示「全系統」的數字，不跟著範圍走——
          三個月前沒處理完的案子今天一樣要處理，被月份藏起來就永遠沒人發現。
        -->
        <button type="button" id="overdueNote" class="overdue-note hidden"></button>

        <!-- 篩選 -->
        <div class="filter-box">
          <button type="button" id="filterToggle" class="filter-toggle">
            <span id="filterToggleText">Filter</span>
            <span id="filterActiveTag" class="tag tag-active hidden"></span>
            <span id="filterArrow" class="filter-arrow">▾</span>
          </button>

          <form id="filterForm" class="filter-body hidden" novalidate>
            <div class="filter-field filter-field-wide">
              <label class="filter-label" for="fKeyword" id="labelKeyword">Kata kunci</label>
              <input type="text" id="fKeyword" autocomplete="off" spellcheck="false">
            </div>

            <div class="filter-field">
              <label class="filter-label" for="fStatus" id="labelStatus">Status</label>
              <select id="fStatus"></select>
            </div>

            <div class="filter-field">
              <label class="filter-label" for="fLocation" id="labelLocation">Kantin</label>
              <select id="fLocation"></select>
            </div>

            <div class="filter-field">
              <label class="filter-label" for="fCategory" id="labelCategory">Kategori</label>
              <select id="fCategory"></select>
            </div>

            <div class="filter-field">
              <label class="filter-label" for="fDateFrom" id="labelDateFrom">Dari tanggal</label>
              <input type="date" id="fDateFrom">
            </div>

            <div class="filter-field">
              <label class="filter-label" for="fDateTo" id="labelDateTo">Sampai tanggal</label>
              <input type="date" id="fDateTo">
            </div>

            <div class="filter-actions">
              <button type="submit" id="searchBtn" class="btn-primary btn-inline">Cari</button>
              <button type="button" id="resetBtn" class="btn-secondary btn-inline">Hapus filter</button>
            </div>
          </form>
        </div>

        <!-- 結果資訊列 -->
        <div class="list-bar">
          <span id="resultInfo" class="list-count"></span>
        </div>

        <div id="savedNote" class="result ok hidden"></div>
        <div id="cappedNote" class="result warn hidden"></div>

        <!-- 載入中 -->
        <div id="listLoading" class="state-box hidden">
          <div class="spinner"></div>
          <p id="listLoadingText">Memuat laporan…</p>
        </div>

        <div id="listError" class="result error hidden"></div>
        <div id="caseList"></div>
      </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

  </div>

  <script src="js/config.js?v=2.2"></script>
  <script src="js/i18n.js?v=2.2"></script>
  <script src="js/ui.js?v=2.2"></script>
  <script src="js/api.js?v=2.2"></script>
  <script src="js/admin-session.js?v=2.2"></script>
  <script src="js/admin-cases.js?v=2.2"></script>

</body>
</html>
