<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCI 餐廳回饋系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">

    <!-- 語言切換 -->
    <div class="lang-switch">
      <button type="button" class="lang-btn" data-lang="id">Bahasa Indonesia</button>
      <button type="button" class="lang-btn" data-lang="zh">中文</button>
    </div>

    <header class="hero">
      <div class="hero-icon">🍽️</div>
      <h1 id="appName">PCI 餐廳回饋系統</h1>
      <p class="hero-tagline" id="tagline">您的意見，讓餐廳更好</p>
    </header>

    <main class="menu">
      <a href="report.html" class="menu-card menu-card-primary">
        <span class="menu-icon">📝</span>
        <span class="menu-text">
          <span class="menu-title" id="reportTitle">提交回報</span>
          <span class="menu-desc" id="reportDesc">反映問題或提出建議</span>
        </span>
        <span class="menu-arrow">›</span>
      </a>

      <a href="query.html" class="menu-card">
        <span class="menu-icon">🔍</span>
        <span class="menu-text">
          <span class="menu-title" id="queryTitle">查詢案件</span>
          <span class="menu-desc" id="queryDesc">查看處理進度</span>
        </span>
        <span class="menu-arrow">›</span>
      </a>
    </main>

  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    /** 依目前語言把畫面上的文字換掉 */
    function render() {
      document.documentElement.lang = getLang() === 'zh' ? 'zh-Hant' : 'id';

      document.getElementById('appName').textContent     = t('appName');
      document.getElementById('tagline').textContent     = t('home.tagline');
      document.getElementById('reportTitle').textContent = t('home.report');
      document.getElementById('reportDesc').textContent  = t('home.reportDesc');
      document.getElementById('queryTitle').textContent  = t('home.query');
      document.getElementById('queryDesc').textContent   = t('home.queryDesc');

      // 標示目前選中的語言
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === getLang());
      });
    }

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setLang(btn.dataset.lang);
        render();
      });
    });

    render();
  </script>

</body>
</html>
