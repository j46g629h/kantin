<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 手機瀏覽器頂端網址列的顏色。沒有這行的話，畫面上面永遠有一條白條 -->
  <meta name="theme-color" content="#EFEFED">
  <!--
    圖示（關卡 5-5）。三個位置各講不同的事，沒有一個浪費：
      分頁圖示（16/32px）→ PCI       只有 3 個字的空間，放最短最獨特的識別
      主畫面圖示（180px）→ PCI GA    空間夠，可以放完整
      主畫面名稱          → Kantin PCI（在 manifest.json）作業系統畫的，永遠清楚，
                                      負責回答「這是什麼」

    ⚠️ apple-touch-icon 一定要有 PNG——**iOS 不吃 SVG**。
       少了這個檔案，iPhone 加到主畫面時會拿「網頁截圖」當圖示。
    ⚠️ 那個 PNG 是**直角滿版**的：iOS 與 Android 會自己套圓角遮罩，
       圖檔自己再帶圓角的話會變成「圓角疊圓角」，四個角出現缺口。
  -->
  <link rel="icon" href="favicon.svg?v=3.4" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3.4">
  <link rel="manifest" href="manifest.json?v=3.4">
  <!-- CSS 還沒下載完之前先鋪底色，避免工廠 wifi 慢時先白閃一下 -->
  <style>html{background:#EFEFED}</style>
  <title>Kantin PCI</title>
  <link rel="stylesheet" href="css/style.css?v=3.4">
</head>
<body>

  <div class="page">

    <!-- 語言切換 -->
    <div class="lang-switch">
      <button type="button" class="lang-btn" data-lang="id">Bahasa Indonesia</button>
      <button type="button" class="lang-btn" data-lang="zh">中文</button>
    </div>

    <!-- 標誌：純文字排的，沒有圖檔（見 css/style.css 的 .wordmark 說明）-->
    <div class="app-bar">
      <span class="wordmark"><b>PCI</b><i>GA</i></span>
    </div>

    <header class="hero">
      <div class="hero-eyebrow">Suara Karyawan</div>
      <h1 id="appName">Suara Karyawan · Kantin PCI</h1>
      <p class="hero-tagline" id="tagline">Bantu kami bikin kantin lebih baik</p>
    </header>

    <main class="menu">
      <!--
        ⚠️ 兩張卡片的份量刻意不同：主要動作是近黑實心 + 重陰影，次要是淺色平面。
           改版前兩張都是白底 1px 框，只差在框粗 1px，掃過去分不出來。
      -->
      <a href="report.html" class="menu-card menu-card-primary" id="reportLink">
        <span class="menu-num">01</span>
        <span class="menu-text">
          <span class="menu-title" id="reportTitle">Lapor Masalah</span>
          <span class="menu-desc" id="reportDesc">Ada masalah atau saran? Kasih tahu kami</span>
        </span>
        <span class="menu-arrow">→</span>
      </a>

      <a href="query.html" class="menu-card">
        <span class="menu-num">02</span>
        <span class="menu-text">
          <span class="menu-title" id="queryTitle">Cek Laporan</span>
          <span class="menu-desc" id="queryDesc">Lihat laporan kamu sudah diproses belum</span>
        </span>
        <span class="menu-arrow">→</span>
      </a>

      <!--
        操作說明入口。
        ⚠️ 刻意**不做成第三張卡片**：兩張卡片的份量差異（近黑實心 vs 淺色平面）
           是為了讓人兩秒內決定要做什麼，加第三張同等份量的會把這個層次打散。
           做成一條輕量連結，想找的人找得到，不想找的人不會被干擾。
        ⚠️ 同分頁開啟，不開新分頁——手機上新分頁只會讓人迷路，
           而首頁沒有任何狀態會因為離開而遺失。
      -->
      <a href="panduan-karyawan.html" class="menu-help" id="helpLink">
        <svg class="menu-help-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 6.8C10.6 5.6 8.6 5 6.3 5c-.9 0-1.8.1-2.5.2-.5.1-.8.5-.8 1v11.1c0 .6.5 1.1 1.2.9.6-.1 1.3-.2 2.1-.2 2 0 3.8.6 5 1.5.4.3 1 .3 1.4 0 1.2-.9 3-1.5 5-1.5.8 0 1.5.1 2.1.2.7.2 1.2-.3 1.2-.9V6.2c0-.5-.3-.9-.8-1-.7-.1-1.6-.2-2.5-.2-2.3 0-4.3.6-5.7 1.8z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M12 6.8v12.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span id="helpText">Gimana caranya?</span>
      </a>
    </main>

    <!-- 系統資訊（內容由 js/config.js 的 SYSTEM_INFO 決定）-->
    <footer class="site-footer">
      <div id="siteFooter"></div>
      <!--
        管理者入口（規格 §6.4）。
        刻意放在這裡而不是藏起來：前端原始碼在 GitHub 上是公開的，
        任何人都找得到 admin.html，「藏」並不會比較安全——
        真正的安全來自密碼雜湊、token 與登入失敗鎖定。
        放出來反而讓 6 位管理者不必記網址。
      -->
      <a href="admin.html" class="admin-entry" id="adminEntry">Login Admin</a>
    </footer>

  </div>

  <script src="js/config.js?v=3.4"></script>
  <script src="js/i18n.js?v=3.4"></script>
  <script src="js/ui.js?v=3.4"></script>
  <!--
    首頁本來不需要 api.js。載進來只為了一件事：**先把選項抓回來**。

    Apps Script 每次回應要 3～8 秒，而使用者在首頁挑「回報 / 查詢」
    大概會停留 2～5 秒——那段時間本來是白白浪費的。
    在這裡先抓，按下〔回報〕時表單就直接出現，不會再看到「載入中…」。
  -->
  <script src="js/api.js?v=3.4"></script>
  <script>
    /** 依目前語言把畫面上的文字換掉 */
    function render() {
      document.documentElement.lang = htmlLang();
      document.title = t('appName');

      document.getElementById('appName').textContent     = t('appName');
      document.getElementById('tagline').textContent     = t('home.tagline');
      document.getElementById('reportTitle').textContent = t('home.report');
      document.getElementById('reportDesc').textContent  = t('home.reportDesc');
      document.getElementById('queryTitle').textContent  = t('home.query');
      document.getElementById('queryDesc').textContent   = t('home.queryDesc');

      document.getElementById('helpText').textContent = t('home.help');

      renderSystemFooter('siteFooter');
      document.getElementById('adminEntry').textContent = t('admin.entry');

      // 標示目前選中的語言
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === getLang());
      });
    }

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setLang(btn.dataset.lang);
        render();
      });
    });

    /**
     * 把網址上的 ?loc= 一起帶到回報頁。
     *
     * report.html 本來就看得懂 ?loc=LOC_02（會自動選好餐廳），
     * 但首頁的連結是寫死的 report.html——**參數走到這裡就掉了**。
     * 少了這幾行，index.html?loc=LOC_02 會安靜地沒有效果，
     * 而「安靜地沒有效果」是最難查的那一種問題。
     *
     * 📌 目前的海報只印一張共用的 QR Code（不帶 loc），所以這段平常用不到。
     *    留著是為了「某一間餐廳想自己貼一張專屬的」那天——
     *    到時候只要換 QR 的網址，不必再改程式。
     */
    function forwardLocation() {
      const loc = new URLSearchParams(location.search).get('loc');
      // 選項代碼長這樣：LOC_02。不是這個格式就當作沒有，
      // 不要把來路不明的字串接到連結上
      if (!loc || !/^[A-Za-z0-9_]{1,32}$/.test(loc)) return;

      const link = document.getElementById('reportLink');
      if (link) link.href = 'report.html?loc=' + encodeURIComponent(loc);
    }

    render();
    forwardLocation();

    // 背景預抓選項。不擋畫面、失敗不吭聲——
    // 抓不到的話 report.html 自己還是會抓一次，跟以前一樣
    prefetchOptions();
  </script>

</body>
</html>
